
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar promoção - MafeBeauty</title>
    <link rel="stylesheet" href="{% static 'css/produtos.css' %}">
</head>
<body>
    <div class="container">
        <h1>Cadastrar promoção</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Cadastrar promoção</button>

            <a href="{% url 'produto_lista' %}">
                Cancelar
            </a>
        </form>
    </div>
</body>
</html>
