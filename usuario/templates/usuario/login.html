<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - mafe beauty</title>

    <link rel="stylesheet" href="{% static 'usuario/login.css' %}">
    <link rel="icon" type="image/png" href="{% static 'usuario/image.png' %}">
</head>
 <body>
<div class="login-container">
    <div class="login-card">
        <div class="logo">
            Mafe <span>Beauty</span>
        </div>
        <h1>Bem-vinda</h1>

        <p class="subtitulo">
            Entre na sua conta para continuar
        </p>

        <form method="POST">
    {% csrf_token %}

    {% if form.errors %}
        <p class="mensagem-erro">
            Usuário ou senha inválidos.
        </p>
    {% endif %}

    <div class="campo">
        <label for="id_username">Usuário</label>
        <input
            type="text"
            id="id_username"
            name="username"
            placeholder="Digite seu usuário"
            required
        >
    </div>

    <div class="campo">
        <label for="id_password">Senha</label>
        <input
            type="password"
            id="id_password"
            name="password"
            placeholder="Digite sua senha"
            required
        >
    </div>

    <button type="submit">ENTRAR</button>
</form>
        <div class="cadastro">
            Ainda não possui uma conta?
            <a href="{% url 'usuario:cadastro' %}">Criar conta</a>
        </div>

</div>
</div>


 </body>
</html>
